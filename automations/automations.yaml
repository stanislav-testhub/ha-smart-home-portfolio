- id: '1754300114133'
  alias: Restart on network connection loss
  description: Restarts the system when the connection to the router is lost
  triggers:
  - trigger: time_pattern
    minutes: /2
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: binary_sensor.lan_ip_1
          state: 'off'
          for:
            hours: 0
            minutes: 2
            seconds: 0
        - condition: state
          entity_id: binary_sensor.lan_ip_1
          state: unavailable
          for:
            hours: 0
            minutes: 2
            seconds: 0
        - condition: state
          entity_id: binary_sensor.lan_ip_1
          state: unknown
          for:
            hours: 0
            minutes: 2
            seconds: 0
      - condition: numeric_state
        entity_id: counter.restarts_counter
        below: 3
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.restarts_counter
        data: {}
        enabled: false
      - delay: 00:01:00
      - if:
        - condition: state
          entity_id: binary_sensor.lan_ip_1
          state: 'on'
        then:
        - action: system_log.write
          data:
            level: info
            message: Network connection restored after interface reset
        else:
        - action: system_log.write
          data:
            level: warning
            message: 'Lost connection to the router. Restarting system (attempt {{
              restart_count + 1 }}/3)

              '
        - action: persistent_notification.create
          data:
            title: "\U0001F504 Network issue"
            message: 'Connection to router lost. Rebooting the system  (attempt {{
              restart_count + 1 }}/3) Time: {{ now().strftime(''%Y-%m-%d %H:%M:%S'')
              }}

              '
        - delay: 00:00:30
        - action: hassio.host_reboot
          data: {}
    - conditions:
      - condition: numeric_state
        entity_id: counter.restarts_counter
        above: 2
      - condition: or
        conditions:
        - condition: state
          entity_id: binary_sensor.lan_ip_1
          state: 'off'
          for:
            hours: 0
            minutes: 3
            seconds: 0
        - condition: state
          entity_id: binary_sensor.lan_ip_1
          state: unavailable
          for:
            hours: 0
            minutes: 3
            seconds: 0
      sequence:
      - action: system_log.write
        data:
          level: error
          message: Reboot limit exceeded. Waiting 30 minutes
      - action: persistent_notification.create
        data:
          title: ⚠️ Critical network issue
          message: "Multiple reboot attempts did not help. Waiting 30 minutes before
            trying again. Time: {{ now().strftime('%Y-%m-%d %H:%M:%S') }}          \n"
      - delay: 00:30:00
      - action: counter.reset
        target:
          entity_id: counter.restarts_counter
        data: {}
    - conditions:
      - condition: state
        entity_id: binary_sensor.lan_ip_1
        state: 'on'
        for:
          hours: 0
          minutes: 0
          seconds: 15
      - condition: numeric_state
        entity_id: counter.restarts_counter
        above: 0
      sequence:
      - action: counter.reset
        target:
          entity_id: counter.restarts_counter
        data: {}
      - action: system_log.write
        data:
          level: info
          message: The connection to the router has been restored. Restarts counter
            is reset
      - action: persistent_notification.create
        data:
          title: ✅ Network restored
          message: 'Connection to the router restored. Time: {{ now().strftime(''%Y-%m-%d
            %H:%M:%S'') }}

            '
  mode: single
  variables:
    router_state: '{{ states(''binary_sensor.lan_ip_1'') }}'
    restart_count: '{{ states(''counter.restarts_counter'') | int(0) }}'
- id: '1757014984648'
