- id: '1730367216678'
  alias: HA maintenance (updates + reboot)
  description: 'Creates a Supervisor full backup, installs available updates, then
    optionally reboots the host. Scheduled for 03:00, and only runs the maintenance
    flow on Mon/Wed/Sat.

    '
  triggers:
  - trigger: time
    id: scheduled_0300
    at: 03:00:00
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: scheduled_0300
      - condition: time
        weekday:
        - mon
        - wed
        - sat
      sequence:
      - delay: 00:01:00
      - parallel:
        - action: update.install
          target:
            entity_id:
            - update.hacs_update
            - update.xiaomi_cloud_map_extractor_update
            - update.xiaomi_miot_auto_update
            - update.mosquitto_broker_update
            - update.local_tuya_update
          data: {}
        - action: update.install
          target:
            entity_id: update.home_assistant_supervisor_update
          data: {}
        - choose:
          - conditions:
            - condition: state
              entity_id: update.home_assistant_core_update
              state: 'on'
            sequence:
            - action: update.install
              target:
                entity_id: update.home_assistant_core_update
              data: {}
        - action: update.install
          target:
            entity_id: update.home_assistant_operating_system_update
      - delay: 00:05:00
      - action: notify.notify
        data:
          message: "\U0001F4BE Backup and Update Done"
      - delay: 00:00:05
      - action: switch.turn_off
        target:
          entity_id: switch.miwifi_44_df_65_36_d2_15_wifi_guest
      - action: hassio.host_reboot
        data: {}
    default: []
  mode: single
  max_exceeded: silent
