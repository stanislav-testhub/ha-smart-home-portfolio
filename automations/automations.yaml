- id: '1730129037456'
  alias: Auto off
  description: Turns off devices in some scenarios
  triggers:
  - type: turned_on
    device_id: <DEVICE_WASHING_MACHINE>
    entity_id: <ENTITY_WASHING_MACHINE>
    domain: switch
    trigger: device
    id: washing machine interaction
  - trigger: time
    at: 07:00:00
    id: Water heater off time morning
    enabled: false
  - trigger: time
    at: '17:00:00'
    id: Water heater off time afternoon
    enabled: false
  - trigger: homeassistant
    event: start
    id: Home assistant started
    enabled: false
  - trigger: numeric_state
    entity_id:
    - sensor.washing_machine_current
    below: 0.35
    for:
      hours: 0
      minutes: 3
      seconds: 0
    id: washing_machine_low_consumption
  - trigger: numeric_state
    entity_id:
    - sensor.power_station_inlet_socket_power
    for:
      hours: 0
      minutes: 0
      seconds: 10
    below: 50
    id: smart_relay_low_consumption
  - trigger: state
    entity_id:
    - switch.power_station_inlet_socket
    to: 'on'
    id: station_charge
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - washing machine interaction
      - condition: device
        type: is_on
        device_id: <DEVICE_POWER_STATION_MAIN>
        entity_id: <ENTITY_POWER_STATION_MAIN>
        domain: switch
      sequence:
      - delay:
          hours: 0
          minutes: 0
          seconds: 1
          milliseconds: 0
      - type: turn_off
        device_id: <DEVICE_WASHING_MACHINE>
        entity_id: <ENTITY_WASHING_MACHINE>
        domain: switch
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id:
          - washing machine interaction
        - condition: trigger
          id:
          - Water heater off time morning
        - condition: trigger
          id:
          - Water heater off time afternoon
        - condition: trigger
          id:
          - Home assistant started
        - condition: trigger
          id:
          - station_charge
      sequence:
      - if:
        - condition: or
          conditions:
          - condition: and
            conditions:
            - condition: trigger
              id:
              - Home assistant started
            - condition: not
              conditions:
              - condition: time
                after: '23:59:00'
                before: 07:00:00
              - condition: time
                after: '11:00:00'
                before: '17:00:00'
              enabled: false
          - condition: trigger
            id:
            - Water heater off time morning
          - condition: trigger
            id:
            - Water heater off time afternoon
          - condition: trigger
            id:
            - washing machine interaction
          - condition: trigger
            id:
            - station_charge
        then:
        - type: turn_off
          device_id: <DEVICE_WATER_HEATER>
          entity_id: <ENTITY_WATER_HEATER>
          domain: switch
        - delay:
            hours: 0
            minutes: 0
            seconds: 1
            milliseconds: 0
        - if:
          - condition: device
            type: is_off
            device_id: <DEVICE_WATER_HEATER>
            entity_id: <ENTITY_WATER_HEATER>
            domain: switch
          - condition: trigger
            id:
            - washing machine interaction
          - condition: numeric_state
            entity_id: sensor.washing_machine_power
            below: 1
          then:
          - action: notify.mobile_app_owner_iphone
            metadata: {}
            data:
              message: ✅ Water heater is off
          else:
          - if:
            - condition: trigger
              id:
              - washing machine interaction
            - condition: not
              conditions:
              - condition: state
                entity_id: switch.<ZIGBEE_DEVICE_ID_1>
                state: 'off'
            then:
            - action: notify.mobile_app_owner_iphone
              metadata: {}
              data:
                message: ❌ Water heater isn't off
    - conditions:
      - condition: trigger
        id:
        - washing_machine_low_consumption
      - condition: device
        type: is_on
        device_id: <DEVICE_WASHING_MACHINE>
        entity_id: <ENTITY_WASHING_MACHINE>
        domain: switch
      sequence:
      - action: notify.mobile_app_owner_iphone
        metadata: {}
        data:
          message: "Laundry finished \U0001F9FA"
      - wait_for_trigger:
        - trigger: numeric_state
          entity_id:
          - sensor.washing_machine_current
          above: 0.35
        timeout:
          minutes: 2
        continue_on_timeout: true
      - if:
        - condition: template
          value_template: '{{ wait.trigger == none }}'
        - condition: numeric_state
          entity_id: sensor.washing_machine_current
          below: 0.35
        - condition: device
          type: is_on
          device_id: <DEVICE_WASHING_MACHINE>
          entity_id: <ENTITY_WASHING_MACHINE>
          domain: switch
        then:
        - type: turn_off
          device_id: <DEVICE_WASHING_MACHINE>
          entity_id: <ENTITY_WASHING_MACHINE>
          domain: switch
        - action: notify.mobile_app_owner_iphone
          metadata: {}
          data:
            message: ✅ Washing machine turned off
          enabled: false
        else:
        - action: notify.mobile_app_owner_iphone
          metadata: {}
          data:
            message: ℹ️ Laundry still running, shutoff cancelled
          enabled: false
    - conditions:
      - condition: trigger
        id:
        - smart_relay_low_consumption
      sequence:
      - repeat:
          while:
          - condition: device
            type: is_on
            device_id: <DEVICE_ECOFLOW_CHARGER>
            entity_id: <ENTITY_ECOFLOW_CHARGER>
            domain: switch
          sequence:
          - type: turn_off
            device_id: <DEVICE_ECOFLOW_CHARGER>
            entity_id: <ENTITY_ECOFLOW_CHARGER>
            domain: switch
      - if:
        - condition: device
          type: is_on
          device_id: <DEVICE_POWER_STATION_MAIN>
          entity_id: <ENTITY_POWER_STATION_MAIN>
          domain: switch
        then:
        - type: turn_off
          device_id: <DEVICE_POWER_STATION_MAIN>
          entity_id: <ENTITY_POWER_STATION_MAIN>
          domain: switch
        enabled: false
  mode: queued
  max: 10
