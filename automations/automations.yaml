- id: '1773227603956'
  alias: Kitchen Bulb Failover
  description: 'When kitchen smart bulb becomes unavailable, turn on LED — but only
    if current time is within 1 hour after next dusk AND surge power is below 30 W.

    '
  triggers:
  - trigger: state
    entity_id: light.smart_bulb_smart_bulb
    to: unavailable
    for:
      seconds: 0
    id: bulb_unavailable
  conditions:
  - condition: sun
    after: sunset
    after_offset: 01:00:00
  - condition: numeric_state
    entity_id: sensor.zimi_v2_caf3_surge_power
    below: 30
    enabled: true
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: bulb_unavailable
