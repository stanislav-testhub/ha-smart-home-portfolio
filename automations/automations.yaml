- id: '1735479108883'
  alias: Power station Temperature Safety Monitor
  description: Monitors balcony temperature for power station safety and sensor availability
  triggers:
  - entity_id:
    - sensor.temp_and_humidity_without_display_temperature
    above: 37
    trigger: numeric_state
    for:
      hours: 0
      minutes: 3
      seconds: 0
  - entity_id:
    - sensor.temp_and_humidity_without_display_temperature
    below: 1
    trigger: numeric_state
    for:
      hours: 0
      minutes: 3
      seconds: 0
  - entity_id:
    - sensor.temp_and_humidity_without_display_temperature
    trigger: state
    to: unavailable
    for:
      hours: 0
      minutes: 3
      seconds: 0
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: sensor.temp_and_humidity_without_display_temperature
        above: 37
      sequence:
      - data:
          title: "\U0001F321️ High Temperature Alert"
          message: Balcony temperature is {{ states('sensor.temp_and_humidity_without_display_temperature')
            }}°C. Battery may be at risk above 40°C.
        action: notify.notify
    - conditions:
      - condition: numeric_state
        entity_id: sensor.temp_and_humidity_without_display_temperature
        below: 1
      sequence:
      - data:
          title: ❄️ Low Temperature Alert
          message: Balcony temperature is {{ states('sensor.temp_and_humidity_without_display_temperature')
            }}°C. Battery may be at risk below 0°C.
        action: notify.notify
    default:
    - data:
        title: ⚠️ Temperature sensor Alert
        message: Balcony temperature sensor is unavailable. Please check the device.
      action: notify.notify
  mode: single
- id: '1735593798538'
  alias: Power Sensor Status Monitor
  description: Monitor power sensor for unknown state and extended zero power
  triggers:
  - entity_id:
    - sensor.<ZIGBEE_DEVICE_ID_1>_power
    to: unavailable
    for:
      minutes: 5
    id: unknown_state
    trigger: state
  - entity_id: sensor.power_zero_duration
    above: 8
    id: zero_power
    trigger: numeric_state
    enabled: false
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: unknown_state
      sequence:
      - data:
          message: ⚠️ Power sensor unresponsive for 5 minutes. Please check device
            connectivity.
          title: Power Sensor Issue
        action: notify.notify
    - conditions:
      - condition: trigger
        id: zero_power
      sequence:
      - data:
          message: 'ℹ️ No power consumption detected for {{ states(''sensor.power_zero_duration'')
            | round(1) }} hours.   Device might be turned off or disconnected.  '
          title: Extended Zero Power
        action: notify.notify
  mode: single
- id: '1736966440332'
  alias: Office Presence Detection Controller
  description: Manages office presence detection based on sensor energy levels
  triggers:
  - entity_id:
    - sensor.hlk_ld2410_56f9_static_target_energy
    above: 9
    id: high_energy
    trigger: numeric_state
  - entity_id:
    - sensor.hlk_ld2410_56f9_static_target_energy
    below: 10
    for:
      hours: 0
      minutes: 1
      seconds: 0
    id: low_energy
    trigger: numeric_state
  actions:
  - choose:
    - conditions:
      - condition: and
        conditions:
        - condition: trigger
          id: high_energy
        - condition: not
          conditions:
          - condition: and
            conditions:
            - condition: numeric_state
              entity_id: sensor.hlk_ld2410_56f9_detection_distance
              above: 300
            - condition: state
              entity_id: switch.monitor_switch
              state: 'off'
      sequence:
      - target:
          entity_id: input_boolean.presence_detected
        action: input_boolean.turn_on
        data: {}
      - if:
        - condition: and
          conditions:
          - condition: time
            after: sensor.sun_next_dusk
            before: '23:30:00'
          - condition: device
            type: is_off
            device_id: <DEVICE_DESK_LAMP>
            entity_id: <ENTITY_DESK_LAMP>
            domain: switch
        then:
        - type: turn_on
          device_id: <DEVICE_OFFICE_LIGHT>
          entity_id: <ENTITY_OFFICE_LIGHT>
          domain: light
          brightness_pct: 100
      - action: switch.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: switch.monitor_switch
    - conditions:
      - condition: and
        conditions:
        - condition: trigger
          id: low_energy
        - condition: time
          after: '11:00:00'
          before: '23:00:00'
      sequence:
      - target:
          entity_id: input_boolean.presence_detected
        action: input_boolean.turn_off
        data: {}
      - if:
        - condition: not
          conditions:
          - condition: time
            weekday:
            - sat
            - sun
        then:
        - action: switch.turn_off
          metadata: {}
          data: {}
          target:
            entity_id: switch.monitor_switch
      - type: turn_off
        device_id: <DEVICE_OFFICE_LIGHT>
        entity_id: <ENTITY_OFFICE_LIGHT>
        domain: light
  mode: single
- id: '1737991528596'
  alias: Turn on office light when dusk
