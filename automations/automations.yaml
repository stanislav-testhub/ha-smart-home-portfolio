        %} {% set current = now() %} {{ current >= window_start and current <= strptime(dusk_time,
        ''%Y-%m-%d %H:%M:%S'') }}

        '
  actions:
  - target:
      device_id: <DEVICE_OFFICE_LIGHT>
    data:
      brightness_pct: 100
    action: light.turn_on
  mode: single
