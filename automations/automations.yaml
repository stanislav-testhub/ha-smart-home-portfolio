  max_exceeded: silent
- id: '1776855470667'
  alias: "\U0001F504 Post-startup reload of flaky integrations"
  description: 'Only reloads integrations that are actually in a failed state. Runs
    checks in parallel. Safe to trigger on every startup.

    '
  triggers:
  - trigger: homeassistant
    event: start
  actions:
  - delay: 00:02:00
  - action: homeassistant.reload_config_entry
    data:
      entry_id: <CONFIG_ENTRY_ID_1>
    enabled: '{{ config_entry_attr(''<CONFIG_ENTRY_ID_1>'', ''state'') != ''ConfigEntryState.LOADED''
      }}'
  - action: homeassistant.reload_config_entry
    data:
      entry_id: <CONFIG_ENTRY_ID_2>
    enabled: '{{ config_entry_attr(''<CONFIG_ENTRY_ID_2>'', ''state'')
      != ''ConfigEntryState.LOADED'' }}'
  - action: homeassistant.reload_config_entry
    data:
      entry_id: <CONFIG_ENTRY_ID_3>
    enabled: '{{ config_entry_attr(''<CONFIG_ENTRY_ID_3>'', ''state'') != ''ConfigEntryState.LOADED''
      }}'
  mode: single
