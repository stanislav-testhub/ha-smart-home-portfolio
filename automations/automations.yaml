- id: '1740924096605'
  alias: Office Workspace Manager
  description: Manages the workspace (light and monitor) based on presence sensor
  triggers:
  - entity_id: sensor.hlk_ld2410_56f9_static_target_energy
    above: 9
    id: high_energy
    trigger: numeric_state
  - entity_id: sensor.hlk_ld2410_56f9_static_target_energy
    below: 10
    for:
      hours: 0
      minutes: 1
      seconds: 0
    id: low_energy
    trigger: numeric_state
  - minutes: /5
    id: time_check
    trigger: time_pattern
  - entity_id: input_boolean.presence_detected
    from: 'off'
    to: 'on'
    id: presence_return
    trigger: state
  - entity_id: light.<ENTITY_OFFICE_LIGHT>
    to: 'off'
    id: light_turned_off
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: light_turned_off
      - condition: state
        entity_id: input_boolean.presence_detected
        state: 'on'
      sequence:
      - data:
          entity_id: input_boolean.light_manually_turned_off
          value: 'on'
        action: input_helper.set_variable
    - conditions:
      - condition: trigger
        id: presence_return
      sequence:
      - data:
          entity_id: input_boolean.light_manually_turned_off
          value: 'off'
        action: input_helper.set_variable
    - conditions:
      - condition: or
        conditions:
        - condition: and
          conditions:
          - condition: trigger
            id: high_energy
          - condition: not
            conditions:
            - condition: and
              conditions:
              - condition: numeric_state
                entity_id: sensor.hlk_ld2410_56f9_detection_distance
                above: 300
              - condition: state
                entity_id: switch.monitor_switch
                state: 'off'
        - condition: and
          conditions:
          - condition: trigger
            id: time_check
          - condition: numeric_state
            entity_id: sensor.hlk_ld2410_56f9_static_target_energy
            above: 9
          - condition: not
            conditions:
            - condition: and
              conditions:
              - condition: numeric_state
                entity_id: sensor.hlk_ld2410_56f9_detection_distance
                above: 300
              - condition: state
                entity_id: switch.monitor_switch
                state: 'off'
      sequence:
      - target:
          entity_id: input_boolean.presence_detected
        action: input_boolean.turn_on
      - if:
        - condition: and
          conditions:
          - condition: template
            value_template: '{% set dusk_time = states(''sensor.sun_next_dusk'') %}
              {% set window_start = strptime(dusk_time, ''%Y-%m-%d %H:%M:%S'') - timedelta(minutes=35)
              %} {% set current = now() %} {{ current >= window_start and current
              <= strptime(''23:50:00'', ''%H:%M:%S'') }}

              '
          - condition: state
            entity_id: input_boolean.light_manually_turned_off
            state: 'off'
        then:
        - target:
            entity_id: light.<ENTITY_OFFICE_LIGHT>
          data:
            brightness_pct: 100
            transition: 2
          action: light.turn_on
      - target:
          entity_id: switch.monitor_switch
        action: switch.turn_on
    - conditions:
      - condition: trigger
        id: low_energy
      - condition: time
        after: '11:00:00'
        before: '23:00:00'
      sequence:
      - target:
          entity_id: input_boolean.presence_detected
        action: input_boolean.turn_off
      - if:
        - condition: not
          conditions:
          - condition: time
            weekday:
            - sat
            - sun
        then:
        - target:
            entity_id: switch.monitor_switch
          action: switch.turn_off
      - target:
          entity_id: light.<ENTITY_OFFICE_LIGHT>
        data:
          transition: 2
        action: light.turn_off
  variables:
    light_auto_control: true
  mode: single
- id: '1754300114111'
  alias: Secret Drawer Vibration Alert
  description: Sends notification when drawer vibration is detected
  triggers:
