      device: *openwrt_device

    - name: "OpenWrt Speedtest Download"
      unique_id: openwrt_speedtest_down_mbps
      state_topic: "collectd/OpenWrt/exec-speedtest/bitrate-download"
      value_template: "{{ value.split(':')[1].split('\x00')[0] | float(0) | round(2) }}"
      unit_of_measurement: "Mbit/s"
      device_class: data_rate
      state_class: measurement
      expire_after: 7200
      device: *openwrt_device

    - name: "OpenWrt Speedtest Upload"
      unique_id: openwrt_speedtest_up_mbps
      state_topic: "collectd/OpenWrt/exec-speedtest/bitrate-upload"
      value_template: "{{ value.split(':')[1].split('\x00')[0] | float(0) | round(2) }}"
      unit_of_measurement: "Mbit/s"
      device_class: data_rate
      state_class: measurement
      expire_after: 7200
      device: *openwrt_device

    # ========== USB Storage (df-mnt-usb_storage) ==========
    - name: "USB Storage Used"
      unique_id: openwrt_usb_storage_used_gib
      state_topic: "collectd/OpenWrt/df-mnt-usb_storage/df_complex-used"
      value_template: "{{ (value.split(':')[1].split('\x00')[0] | float(0) / 1073741824) | round(2) }}"
      unit_of_measurement: "GiB"
      device_class: data_size
      state_class: measurement
      expire_after: 300
      device: *openwrt_device

    - name: "USB Storage Free"
      unique_id: openwrt_usb_storage_free_gib
      state_topic: "collectd/OpenWrt/df-mnt-usb_storage/df_complex-free"
      value_template: "{{ (value.split(':')[1].split('\x00')[0] | float(0) / 1073741824) | round(2) }}"
      unit_of_measurement: "GiB"
      device_class: data_size
      state_class: measurement
      expire_after: 300
      device: *openwrt_device

    - name: "USB Storage Reserved"
      unique_id: openwrt_usb_storage_reserved_gib
      state_topic: "collectd/OpenWrt/df-mnt-usb_storage/df_complex-reserved"
      value_template: "{{ (value.split(':')[1].split('\x00')[0] | float(0) / 1073741824) | round(2) }}"
      unit_of_measurement: "GiB"
      device_class: data_size
      state_class: measurement
      expire_after: 300
      device: *openwrt_device

    - name: "USB Storage Free Percent"
      unique_id: openwrt_usb_storage_free_pct
      state_topic: "collectd/OpenWrt/df-mnt-usb_storage/percent_bytes-free"
      value_template: "{{ value.split(':')[1].split('\x00')[0] | float(0) | round(2) }}"
      unit_of_measurement: "%"
      state_class: measurement
      expire_after: 300
      device: *openwrt_device

    - name: "USB Storage Used Percent"
      unique_id: openwrt_usb_storage_used_pct
      state_topic: "collectd/OpenWrt/df-mnt-usb_storage/percent_bytes-used"
      value_template: "{{ value.split(':')[1].split('\x00')[0] | float(0) | round(2) }}"
      unit_of_measurement: "%"
      state_class: measurement
      expire_after: 300
      device: *openwrt_device

    # ========== Disk sda1 I/O Metrics ==========
    - name: "Disk sda1 Read Ops"
      unique_id: openwrt_disk_sda1_read_ops
      state_topic: "collectd/OpenWrt/disk-sda1/disk_ops"
      value_template: "{{ value.split(':')[1] | float(0) | round(2) }}"
