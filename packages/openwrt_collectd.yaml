    - name: "Disk sda1 Write Ops"
      unique_id: openwrt_disk_sda1_write_ops
      state_topic: "collectd/OpenWrt/disk-sda1/disk_ops"
      value_template: "{{ value.split(':')[2].split('\x00')[0] | float(0) | round(2) }}"
