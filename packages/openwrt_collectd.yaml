      value_template: "{{ value.split(':')[1].split('\x00')[0] | int(0) }}"
      state_class: measurement
      expire_after: 180
      device: *openwrt_device

    - name: "OpenWrt Conntrack Max"
      unique_id: openwrt_conntrack_max
