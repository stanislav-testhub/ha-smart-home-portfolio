      expire_after: 180
      device: *openwrt_device

    # ========== WAN (br-WAN / eth1) ==========
    - name: "OpenWrt br-WAN (eth1) RX"
      unique_id: openwrt_br_wan_rx_mbps
      state_topic: "collectd/OpenWrt/interface-br-WAN/if_octets"
      value_template: "{{ ((value.split(':')[1] | float(0)) * 8 / 1000000) | round(4) }}"
      unit_of_measurement: "Mbit/s"
      device_class: data_rate
      state_class: measurement
      expire_after: 180
      device: *openwrt_device

    - name: "OpenWrt br-WAN (eth1) TX"
      unique_id: openwrt_br_wan_tx_mbps
      state_topic: "collectd/OpenWrt/interface-br-WAN/if_octets"
      value_template: "{{ ((value.split(':')[2].split('\x00')[0] | float(0)) * 8 / 1000000) | round(4) }}"
      unit_of_measurement: "Mbit/s"
      device_class: data_rate
      state_class: measurement
      expire_after: 180
      device: *openwrt_device

    - name: "OpenWrt br-WAN (eth1) RX Packets"
      unique_id: openwrt_br_wan_rx_pps
      state_topic: "collectd/OpenWrt/interface-br-WAN/if_packets"
      value_template: "{{ value.split(':')[1] | float(0) | round(2) }}"
      unit_of_measurement: "pkt/s"
      state_class: measurement
      expire_after: 180
      device: *openwrt_device

    - name: "OpenWrt br-WAN (eth1) TX Packets"
      unique_id: openwrt_br_wan_tx_pps
      state_topic: "collectd/OpenWrt/interface-br-WAN/if_packets"
      value_template: "{{ value.split(':')[2].split('\x00')[0] | float(0) | round(2) }}"
      unit_of_measurement: "pkt/s"
      state_class: measurement
      expire_after: 180
      device: *openwrt_device

    - name: "OpenWrt br-WAN (eth1) Errors"
      unique_id: openwrt_br_wan_errors
      state_topic: "collectd/OpenWrt/interface-br-WAN/if_errors"
      value_template: >-
        {% set parts = value.split(':') %}
        {% if parts|length >= 3 %}
        {% set rx = parts[1]|float(0) %}
        {% set tx = parts[2].split('\x00')[0]|float(0) %}
        {{ (rx + tx)|round(0)|int }}
        {% else %}
        {{ 0 }}
        {% endif %}
      unit_of_measurement: "pkt/s"
      state_class: measurement
      expire_after: 180
      device: *openwrt_device

    - name: "OpenWrt br-WAN (eth1) Dropped"
      unique_id: openwrt_br_wan_dropped
      state_topic: "collectd/OpenWrt/interface-br-WAN/if_dropped"
      value_template: >-
        {% set parts = value.split(':') %}
        {% if parts|length >= 3 %}
        {% set rx = parts[1]|float(0) %}
        {% set tx = parts[2].split('\x00')[0]|float(0) %}
        {{ (rx + tx)|round(0)|int }}
        {% else %}
        {{ 0 }}
        {% endif %}
      unit_of_measurement: "pkt/s"
      state_class: measurement
      expire_after: 180
      device: *openwrt_device

