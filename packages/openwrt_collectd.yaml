mqtt:
  sensor:
    # ========== Router health ==========
    - name: "OpenWrt Temperature"
      unique_id: openwrt_temperature_c
      state_topic: "collectd/OpenWrt/thermal-thermal_zone0/temperature"
      value_template: "{{ value.split(':')[1].split('\x00')[0] | float(0) | round(2) }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      expire_after: 180
      device: &openwrt_device
        identifiers: ["openwrt_24_10_router"]
        name: "OpenWRT"
        manufacturer: "OpenWrt"
        model: "Router"
        sw_version: "24.10+"

    - name: "OpenWrt Load 1m"
      unique_id: openwrt_load_1m
      state_topic: "collectd/OpenWrt/load/load"
      value_template: "{{ value.split(':')[1] | float(0) | round(3) }}"
      state_class: measurement
      expire_after: 180
      device: *openwrt_device

    - name: "OpenWrt Load 5m"
      unique_id: openwrt_load_5m
      state_topic: "collectd/OpenWrt/load/load"
      value_template: "{{ value.split(':')[2] | float(0) | round(3) }}"
      state_class: measurement
      expire_after: 180
      device: *openwrt_device

    - name: "OpenWrt Load 15m"
      unique_id: openwrt_load_15m
      state_topic: "collectd/OpenWrt/load/load"
      value_template: "{{ value.split(':')[3].split('\x00')[0] | float(0) | round(3) }}"
      state_class: measurement
      expire_after: 180
      device: *openwrt_device

    - name: "OpenWrt CPU User"
      unique_id: openwrt_cpu_user_pct
      state_topic: "collectd/OpenWrt/cpu/percent-user"
      value_template: "{{ value.split(':')[1].split('\x00')[0] | float(0) | round(3) }}"
      unit_of_measurement: "%"
      state_class: measurement
      expire_after: 180
      device: *openwrt_device

    - name: "OpenWrt CPU System"
      unique_id: openwrt_cpu_system_pct
      state_topic: "collectd/OpenWrt/cpu/percent-system"
      value_template: "{{ value.split(':')[1].split('\x00')[0] | float(0) | round(3) }}"
      unit_of_measurement: "%"
      state_class: measurement
      expire_after: 180
      device: *openwrt_device

    - name: "OpenWrt CPU Idle"
      unique_id: openwrt_cpu_idle_pct
      state_topic: "collectd/OpenWrt/cpu/percent-idle"
      value_template: "{{ value.split(':')[1].split('\x00')[0] | float(0) | round(2) }}"
      unit_of_measurement: "%"
      state_class: measurement
      expire_after: 180
      device: *openwrt_device

    - name: "OpenWrt CPU Interrupt"
      unique_id: openwrt_cpu_interrupt_pct
      state_topic: "collectd/OpenWrt/cpu/percent-interrupt"
      value_template: "{{ value.split(':')[1].split('\x00')[0] | float(0) | round(3) }}"
      unit_of_measurement: "%"
      state_class: measurement
      expire_after: 180
      device: *openwrt_device

    - name: "OpenWrt CPU SoftIRQ"
      unique_id: openwrt_cpu_softirq_pct
      state_topic: "collectd/OpenWrt/cpu/percent-softirq"
      value_template: "{{ value.split(':')[1].split('\x00')[0] | float(0) | round(3) }}"
      unit_of_measurement: "%"
      state_class: measurement
      expire_after: 180
      device: *openwrt_device

    - name: "OpenWrt Memory Used"
      unique_id: openwrt_mem_used_mib
      state_topic: "collectd/OpenWrt/memory/memory-used"
      value_template: "{{ (value.split(':')[1].split('\x00')[0] | float(0) / 1048576) | round(1) }}"
      unit_of_measurement: "MiB"
      state_class: measurement
      expire_after: 180
      device: *openwrt_device

    - name: "OpenWrt Memory Free"
      unique_id: openwrt_mem_free_mib
      state_topic: "collectd/OpenWrt/memory/memory-free"
      value_template: "{{ (value.split(':')[1].split('\x00')[0] | float(0) / 1048576) | round(1) }}"
      unit_of_measurement: "MiB"
      state_class: measurement
      expire_after: 180
      device: *openwrt_device

    - name: "OpenWrt Memory Cached"
