- id: '1730130379666'
  alias: Power outage schedule added
  description: Notifies when a power schedule for today or tomorrow is added
  triggers:
  - entity_id:
    - sensor.oe_today
    to:
    id: today
    for:
      hours: 0
      minutes: 0
      seconds: 5
    from: unknown
    trigger: state
  - entity_id:
    - sensor.oe_tomorrow
    to:
    id: tomorrow
    for:
      hours: 0
      minutes: 0
      seconds: 5
    from: unknown
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - today
      sequence:
      - data:
          day: today
          current: '{{ trigger.to_state.state }}'
          previous: '{{ trigger.from_state.state }}'
        action: script.notify_power_outage_schedule_added
    - conditions:
      - condition: trigger
        id:
        - tomorrow
      sequence:
      - data:
          day: tomorrow
          current: '{{ trigger.to_state.state }}'
          previous: '{{ trigger.from_state.state }}'
        action: script.notify_power_outage_schedule_added
  mode: single
